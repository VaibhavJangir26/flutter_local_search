name: flutter_local_search
description: >-
  Offline-first full-text search engine for Flutter and Dart with BM25F ranking,
  typo-tolerant fuzzy search, prefix autocomplete, phrase queries, facets, and
  SQLite WAL.
version: 0.1.1
repository: https://github.com/VaibhavJangir26/flutter_local_search
issue_tracker: https://github.com/VaibhavJangir26/flutter_local_search/issues

topics:
  - search
  - full-text-search
  - offline
  - sqlite
  - fuzzy-search

environment:
  sdk: ^3.12.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

